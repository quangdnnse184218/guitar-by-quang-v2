<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Đăng Ký Thành Viên — Guitar By Quang</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Prevent theme flash & sync with localStorage -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('gbq_theme');
          if (saved !== 'dark') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        } catch (e) { }
      })();
    </script>
    
    <!-- Google Fonts: Be Vietnam Pro, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-bg-base text-text-primary min-h-screen relative flex flex-col justify-between overflow-x-hidden">
    <div class="grain-overlay" aria-hidden="true"></div>

    <!-- Header -->
    <header class="py-5 px-6 sm:px-12 flex items-center justify-between border-b border-glass-border">
      <a href="/" class="flex items-center gap-3 group">
        <div class="w-9 h-9 rounded-xl bg-warm-gradient text-white flex items-center justify-center font-black text-base shadow-sm group-hover:scale-105 transition-transform">
          🎸
        </div>
        <div>
          <span class="text-base font-extrabold text-text-primary tracking-tight block leading-tight">Guitar By Quang</span>
          <span class="text-[11px] font-semibold text-text-muted">Nền Tảng Tự Học Guitar</span>
        </div>
      </a>
      <div class="flex items-center gap-3">
        <!-- Theme Toggle Button -->
        <button id="theme-toggle-btn" aria-label="Chuyển đổi giao diện Sáng / Tối"
          title="Chuyển đổi giao diện Sáng / Tối"
          class="p-2 rounded-full bg-glass-bg hover:bg-glass-bg-hover text-text-primary border border-glass-border flex items-center justify-center transition-colors cursor-pointer flex-shrink-0">
          <svg class="sun-icon w-4 h-4 text-accent-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41">
            </path>
          </svg>
          <svg class="moon-icon w-4 h-4 text-accent-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>

        <a href="/" class="text-xs font-bold text-text-muted hover:text-accent-primary transition-colors flex items-center gap-1">
          <span>← Về trang chủ</span>
        </a>
      </div>
    </header>

    <!-- Main Register Card -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 my-auto">
      <div class="w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 border border-glass-border shadow-2xl space-y-6">
        
        <div class="text-center space-y-2">
          <div class="w-14 h-14 mx-auto rounded-2xl bg-accent-primary/15 text-accent-primary border border-accent-primary/30 flex items-center justify-center text-2xl shadow-inner">
            👋
          </div>
          <h1 class="text-2xl font-extrabold text-text-primary">Tham Gia Cùng Chúng Tôi</h1>
          <p class="text-xs text-text-muted font-medium">Tạo tài khoản để trải nghiệm toàn bộ tính năng</p>
        </div>

        <!-- Alert Box -->
        <div id="register-alert" class="hidden p-3.5 rounded-2xl bg-rose-500/15 border border-rose-500/30 text-rose-600 dark:text-rose-400 text-xs font-semibold leading-relaxed flex items-center gap-2.5">
          <svg id="register-alert-icon" class="w-4 h-4 flex-shrink-0 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span id="register-alert-text">Lỗi đăng ký</span>
        </div>

        <!-- Register Form -->
        <form id="register-form" class="space-y-4" novalidate>
          <div class="space-y-1.5">
            <label for="register-name" class="text-xs font-bold text-text-primary block flex items-center justify-between">
              <span>Tên hiển thị <span class="text-rose-500">*</span></span>
            </label>
            <input
              type="text"
              id="register-name"
              required
              placeholder="Ví dụ: Quang Guitar..."
              class="w-full px-4 py-3 rounded-2xl bg-black/5 dark:bg-white/5 border border-glass-border text-sm text-text-primary placeholder:text-text-muted focus:outline-none focus:border-accent-primary transition-colors"
            />
          </div>

          <div class="space-y-1.5">
            <label for="register-email" class="text-xs font-bold text-text-primary block flex items-center justify-between">
              <span>Email <span class="text-rose-500">*</span></span>
            </label>
            <input
              type="email"
              id="register-email"
              required
              placeholder="vidu@gmail.com"
              class="w-full px-4 py-3 rounded-2xl bg-black/5 dark:bg-white/5 border border-glass-border text-sm text-text-primary placeholder:text-text-muted focus:outline-none focus:border-accent-primary transition-colors"
            />
          </div>

          <div class="space-y-1.5">
            <label for="register-password" class="text-xs font-bold text-text-primary block flex items-center justify-between">
              <span>Mật Khẩu <span class="text-rose-500">*</span></span>
              <span class="text-[10px] text-text-muted font-normal">Tối thiểu 6 ký tự</span>
            </label>
            <div class="relative">
              <input
                type="password"
                id="register-password"
                required
                minlength="6"
                placeholder="••••••••"
                class="w-full pl-4 pr-11 py-3 rounded-2xl bg-black/5 dark:bg-white/5 border border-glass-border text-sm text-text-primary placeholder:text-text-muted focus:outline-none focus:border-accent-primary transition-colors"
              />
              <button
                type="button"
                data-toggle-password="register-password"
                class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 rounded-xl text-text-muted hover:text-text-primary hover:bg-black/5 dark:hover:bg-white/5 transition-colors cursor-pointer"
                title="Hiện hoặc ẩn mật khẩu"
                aria-label="Hiện hoặc ẩn mật khẩu"
              >
                <svg class="w-4 h-4 eye-open" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <svg class="w-4 h-4 eye-closed hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                </svg>
              </button>
            </div>
          </div>

          <div class="space-y-1.5">
            <label for="register-confirm-password" class="text-xs font-bold text-text-primary block flex items-center justify-between">
              <span>Xác Nhận Mật Khẩu <span class="text-rose-500">*</span></span>
            </label>
            <div class="relative">
              <input
                type="password"
                id="register-confirm-password"
                required
                minlength="6"
                placeholder="Nhập lại mật khẩu..."
                class="w-full pl-4 pr-11 py-3 rounded-2xl bg-black/5 dark:bg-white/5 border border-glass-border text-sm text-text-primary placeholder:text-text-muted focus:outline-none focus:border-accent-primary transition-colors"
              />
              <button
                type="button"
                data-toggle-password="register-confirm-password"
                class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 rounded-xl text-text-muted hover:text-text-primary hover:bg-black/5 dark:hover:bg-white/5 transition-colors cursor-pointer"
                title="Hiện hoặc ẩn mật khẩu"
                aria-label="Hiện hoặc ẩn mật khẩu"
              >
                <svg class="w-4 h-4 eye-open" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <svg class="w-4 h-4 eye-closed hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                </svg>
              </button>
            </div>
          </div>

          <button
            type="submit"
            id="register-submit-btn"
            class="w-full py-3.5 rounded-full bg-warm-gradient hover:brightness-105 text-white font-bold text-sm transition-all shadow-glow active:scale-[0.98] flex items-center justify-center gap-2 cursor-pointer mt-2"
          >
            <span id="btn-text">Đăng Ký Tài Khoản</span>
            <div id="btn-spinner" class="hidden w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></div>
          </button>
        </form>

        <div class="text-center pt-2">
          <p class="text-xs text-text-muted font-medium">
            Đã có tài khoản? <a href="/login.html" class="text-accent-primary font-bold hover:underline">Đăng nhập tại đây</a>
          </p>
        </div>

      </div>
    </main>

    <!-- Footer -->
    <footer class="py-5 text-center text-xs text-text-muted border-t border-glass-border">
      © 2026 Guitar By Quang • Mọi bản quyền được bảo hộ
    </footer>

    <!-- Global Toast Container -->
    <div id="toast-notification" class="fixed top-6 right-6 z-[9999] opacity-0 pointer-events-none transition-all duration-300 transform translate-x-12">
      <div class="bg-glass-bg backdrop-blur-xl border border-glass-border rounded-2xl shadow-xl px-5 py-4 max-w-sm flex items-center gap-3">
        <div id="toast-icon" class="flex-shrink-0 text-xl"></div>
        <p id="toast-message" class="text-text-primary font-medium text-sm leading-snug"></p>
      </div>
    </div>

    <!-- Common utilities (showToast) -->
    <script type="module" src="/src/common.js"></script>
    <script type="module" src="/src/register.js"></script>
  </body>
</html>
