<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Không tìm thấy trang — Guitar By Quang</title>
    <meta name="description" content="Trang bạn tìm không tồn tại hoặc đã bị di chuyển. Quay lại trang chủ Guitar By Quang để tiếp tục tìm kho Video Tab, công cụ tập đàn và các trò chơi luyện tai." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Prevent theme flash & sync with localStorage -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('gbq_theme');
          if (saved !== 'dark') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        } catch (e) { }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-bg-base text-text-primary min-h-screen relative flex flex-col justify-between overflow-x-hidden">
    <div class="grain-overlay" aria-hidden="true"></div>

    <!-- Header — bản gọn giống login.html, không cần đầy đủ nav/đăng nhập
         vì đây là trang lỗi, chỉ cần lối thoát rõ ràng về trang chủ. -->
    <header class="py-5 px-6 sm:px-12 flex items-center justify-between border-b border-glass-border">
      <a href="/" class="flex items-center gap-3 group">
        <div class="w-9 h-9 rounded-full overflow-hidden border-2 border-accent-primary/80 flex-shrink-0 bg-stone-300 group-hover:scale-105 transition-transform">
          <img src="/assets/avatar.jpg" alt="" class="w-full h-full object-cover object-center" />
        </div>
        <div>
          <span class="text-base font-extrabold text-text-primary tracking-tight block leading-tight">Guitar By Quang</span>
          <span class="text-xs font-semibold text-text-muted">fingerstyle diary • Nhật Quang</span>
        </div>
      </a>
      <div class="flex items-center gap-3">
        <button id="theme-toggle-btn" aria-label="Chuyển đổi giao diện Sáng / Tối"
          title="Chuyển đổi giao diện Sáng / Tối"
          class="p-2 rounded-full bg-glass-bg hover:bg-glass-bg-hover text-text-primary border border-glass-border flex items-center justify-center transition-colors cursor-pointer flex-shrink-0">
          <svg class="sun-icon w-4 h-4 text-accent-primary" aria-hidden="true" data-ph="sun" viewBox="0 0 256 256" fill="currentColor"><path d="M116,36V20a12,12,0,0,1,24,0V36a12,12,0,0,1-24,0Zm80,92a68,68,0,1,1-68-68A68.07,68.07,0,0,1,196,128Zm-24,0a44,44,0,1,0-44,44A44.05,44.05,0,0,0,172,128ZM51.51,68.49a12,12,0,1,0,17-17l-12-12a12,12,0,0,0-17,17Zm0,119-12,12a12,12,0,0,0,17,17l12-12a12,12,0,1,0-17-17ZM196,72a12,12,0,0,0,8.49-3.51l12-12a12,12,0,0,0-17-17l-12,12A12,12,0,0,0,196,72Zm8.49,115.51a12,12,0,0,0-17,17l12,12a12,12,0,0,0,17-17ZM48,128a12,12,0,0,0-12-12H20a12,12,0,0,0,0,24H36A12,12,0,0,0,48,128Zm80,80a12,12,0,0,0-12,12v16a12,12,0,0,0,24,0V220A12,12,0,0,0,128,208Zm108-92H220a12,12,0,0,0,0,24h16a12,12,0,0,0,0-24Z"/></svg>
          <svg class="moon-icon w-4 h-4 text-accent-primary" aria-hidden="true" data-ph="moon" viewBox="0 0 256 256" fill="currentColor"><path d="M236.37,139.4a12,12,0,0,0-12-3A84.07,84.07,0,0,1,119.6,31.59a12,12,0,0,0-15-15A108.86,108.86,0,0,0,49.69,55.07,108,108,0,0,0,136,228a107.09,107.09,0,0,0,64.93-21.69,108.86,108.86,0,0,0,38.44-54.94A12,12,0,0,0,236.37,139.4Zm-49.88,47.74A84,84,0,0,1,68.86,69.51,84.93,84.93,0,0,1,92.27,48.29Q92,52.13,92,56A108.12,108.12,0,0,0,200,164q3.87,0,7.71-.27A84.79,84.79,0,0,1,186.49,187.14Z"/></svg>
        </button>
      </div>
    </header>

    <!-- Nội dung chính -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 my-auto">
      <div class="w-full max-w-lg glass-card rounded-3xl p-8 sm:p-10 border border-glass-border shadow-2xl text-center space-y-6">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-accent-primary/15 text-accent-primary border border-accent-primary/30 flex items-center justify-center text-3xl shadow-inner"><svg class="w-6 h-6" aria-hidden="true" data-ph="music-notes" viewBox="0 0 256 256" fill="currentColor"><path d="M212.92,17.69a8,8,0,0,0-6.86-1.45l-128,32A8,8,0,0,0,72,56V166.08A36,36,0,1,0,88,196V110.25l112-28v51.83A36,36,0,1,0,216,164V24A8,8,0,0,0,212.92,17.69ZM52,216a20,20,0,1,1,20-20A20,20,0,0,1,52,216ZM88,93.75V62.25l112-28v31.5ZM180,184a20,20,0,1,1,20-20A20,20,0,0,1,180,184Z"/></svg></div>
        <div class="space-y-2">
          <p class="text-xs font-bold uppercase tracking-widest text-accent-primary">Lỗi 404</p>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-text-primary">Không tìm thấy trang này</h1>
          <p class="text-sm text-text-muted font-medium leading-relaxed max-w-sm mx-auto">
            Trang bạn tìm có thể đã bị di chuyển, đổi tên hoặc chưa từng tồn tại. Thử một trong các lối sau nhé.
          </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 text-sm">
          <a href="/index.html"
            class="px-4 py-3 rounded-2xl bg-warm-gradient text-white font-extrabold shadow-md hover:brightness-105 active:scale-95 transition-all">
            Trang chủ
          </a>
          <a href="/kho-tab.html"
            class="px-4 py-3 rounded-2xl bg-glass-bg border border-glass-border text-text-primary font-bold hover:border-accent-primary hover:text-accent-primary transition-all">
            Kho Video Tab
          </a>
          <a href="/cong-cu.html"
            class="px-4 py-3 rounded-2xl bg-glass-bg border border-glass-border text-text-primary font-bold hover:border-accent-primary hover:text-accent-primary transition-all">
            Công cụ
          </a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="py-5 text-center text-xs text-text-muted border-t border-glass-border">
      © 2026 Guitar By Quang • Mọi bản quyền được bảo hộ
    </footer>

    <script type="module">
      import { initThemeToggle } from '/src/theme-toggle.js'
      initThemeToggle()
    </script>
  </body>
</html>
