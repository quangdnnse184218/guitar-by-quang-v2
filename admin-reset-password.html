<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Đặt lại mật khẩu quản trị — Guitar By Quang</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Prevent theme flash & sync with localStorage -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('gbq_theme');
          if (saved !== 'dark') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        } catch (e) { }
      })();
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link rel="preconnect" href="https://covzjzcqerldfssxasax.supabase.co" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-bg-base text-text-primary min-h-screen relative flex flex-col justify-between overflow-x-hidden">
    <div class="grain-overlay" aria-hidden="true"></div>

    <!-- Header -->
    <header class="py-5 px-6 sm:px-12 flex items-center justify-between border-b border-glass-border">
      <a href="/" class="flex items-center gap-3 group">
        <div class="w-9 h-9 rounded-full overflow-hidden border-2 border-accent-primary/80 flex-shrink-0 bg-stone-300 group-hover:scale-105 transition-transform">
          <img src="/assets/avatar.jpg" alt="" class="w-full h-full object-cover object-center" />
        </div>
        <div>
          <span class="text-base font-extrabold text-text-primary tracking-tight block leading-tight">Guitar By Quang</span>
          <span class="text-xs font-semibold text-text-muted">Quản trị nội bộ</span>
        </div>
      </a>
      <div class="flex items-center gap-3">
        <!-- Theme Toggle Button -->
        <button id="theme-toggle-btn" aria-label="Chuyển đổi giao diện Sáng / Tối"
          title="Chuyển đổi giao diện Sáng / Tối"
          class="p-2 rounded-full bg-glass-bg hover:bg-glass-bg-hover text-text-primary border border-glass-border flex items-center justify-center transition-colors cursor-pointer flex-shrink-0">
          <svg class="sun-icon w-4 h-4 text-accent-primary" aria-hidden="true" data-ph="sun" viewBox="0 0 256 256" fill="currentColor"><path d="M116,36V20a12,12,0,0,1,24,0V36a12,12,0,0,1-24,0Zm80,92a68,68,0,1,1-68-68A68.07,68.07,0,0,1,196,128Zm-24,0a44,44,0,1,0-44,44A44.05,44.05,0,0,0,172,128ZM51.51,68.49a12,12,0,1,0,17-17l-12-12a12,12,0,0,0-17,17Zm0,119-12,12a12,12,0,0,0,17,17l12-12a12,12,0,1,0-17-17ZM196,72a12,12,0,0,0,8.49-3.51l12-12a12,12,0,0,0-17-17l-12,12A12,12,0,0,0,196,72Zm8.49,115.51a12,12,0,0,0-17,17l12,12a12,12,0,0,0,17-17ZM48,128a12,12,0,0,0-12-12H20a12,12,0,0,0,0,24H36A12,12,0,0,0,48,128Zm80,80a12,12,0,0,0-12,12v16a12,12,0,0,0,24,0V220A12,12,0,0,0,128,208Zm108-92H220a12,12,0,0,0,0,24h16a12,12,0,0,0,0-24Z"/></svg>
          <svg class="moon-icon w-4 h-4 text-accent-primary" aria-hidden="true" data-ph="moon" viewBox="0 0 256 256" fill="currentColor"><path d="M236.37,139.4a12,12,0,0,0-12-3A84.07,84.07,0,0,1,119.6,31.59a12,12,0,0,0-15-15A108.86,108.86,0,0,0,49.69,55.07,108,108,0,0,0,136,228a107.09,107.09,0,0,0,64.93-21.69,108.86,108.86,0,0,0,38.44-54.94A12,12,0,0,0,236.37,139.4Zm-49.88,47.74A84,84,0,0,1,68.86,69.51,84.93,84.93,0,0,1,92.27,48.29Q92,52.13,92,56A108.12,108.12,0,0,0,200,164q3.87,0,7.71-.27A84.79,84.79,0,0,1,186.49,187.14Z"/></svg>
        </button>

        <a href="/admin-login.html" class="text-xs font-bold text-text-muted hover:text-accent-primary transition-colors flex items-center gap-1">
          <span>← Về trang đăng nhập Admin</span>
        </a>
      </div>
    </header>

    <!-- Main Card -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 my-auto">
      <div class="w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 border border-glass-border shadow-2xl space-y-6">
        
        <div class="text-center space-y-2">
          <div class="w-14 h-14 mx-auto rounded-2xl bg-accent-primary/15 text-accent-primary border border-accent-primary/30 flex items-center justify-center text-2xl shadow-inner"><svg class="w-6 h-6" aria-hidden="true" data-ph="lock" viewBox="0 0 256 256" fill="currentColor"><path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96ZM208,208H48V96H208V208Zm-68-56a12,12,0,1,1-12-12A12,12,0,0,1,140,152Z"/></svg></div>
          <h1 class="text-2xl font-extrabold text-text-primary">Đặt Lại Mật Khẩu Admin</h1>
          <p class="text-xs text-text-muted font-medium">Nhập mật khẩu mới cho tài khoản Quản trị viên</p>
        </div>

        <!-- Account Badge -->
        <div id="account-badge" class="p-3 rounded-2xl bg-black/5 dark:bg-white/5 border border-glass-border flex items-center justify-between gap-2 text-xs">
          <span class="text-text-muted font-medium">Tài khoản Admin:</span>
          <span id="account-email" class="font-bold text-accent-primary truncate">Đang xác thực liên kết...</span>
        </div>

        <!-- Alert Box -->
        <div id="reset-alert" class="hidden p-3.5 rounded-2xl bg-rose-500/15 border border-rose-500/30 text-rose-700 dark:text-rose-300 text-xs font-semibold leading-relaxed flex items-center gap-2.5">
          <svg id="reset-alert-icon" class="w-4 h-4 flex-shrink-0 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span id="reset-alert-text">Thông báo</span>
        </div>

        <!-- Form Reset Password -->
        <form id="admin-reset-password-form" class="space-y-4" novalidate>
          <div class="space-y-1.5">
            <label for="new-password" class="text-xs font-bold text-text-primary block flex items-center justify-between">
              <span>Mật Khẩu Mới</span>
              <span class="text-xs text-text-muted font-normal">Tối thiểu 8 ký tự, gồm chữ hoa, chữ thường và số</span>
            </label>
            <div class="relative">
              <input
                type="password"
                id="new-password"
                required
                minlength="8"
                placeholder="••••••••"
                class="w-full pl-4 pr-11 py-3 rounded-2xl bg-black/5 dark:bg-white/5 border border-glass-border text-sm text-text-primary placeholder:text-text-muted focus:outline-none focus:border-accent-primary transition-colors"
              />
              <button
                type="button"
                data-toggle-password="new-password"
                class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 rounded-xl text-text-muted hover:text-text-primary hover:bg-black/5 dark:hover:bg-white/5 transition-colors cursor-pointer"
                title="Hiện hoặc ẩn mật khẩu"
                aria-label="Hiện hoặc ẩn mật khẩu"
              >
                <svg class="w-4 h-4 eye-open" aria-hidden="true" data-ph="eye" viewBox="0 0 256 256" fill="currentColor"><path d="M251,123.13c-.37-.81-9.13-20.26-28.48-39.61C196.63,57.67,164,44,128,44S59.37,57.67,33.51,83.52C14.16,102.87,5.4,122.32,5,123.13a12.08,12.08,0,0,0,0,9.75c.37.82,9.13,20.26,28.49,39.61C59.37,198.34,92,212,128,212s68.63-13.66,94.48-39.51c19.36-19.35,28.12-38.79,28.49-39.61A12.08,12.08,0,0,0,251,123.13Zm-46.06,33C183.47,177.27,157.59,188,128,188s-55.47-10.73-76.91-31.88A130.36,130.36,0,0,1,29.52,128,130.45,130.45,0,0,1,51.09,99.89C72.54,78.73,98.41,68,128,68s55.46,10.73,76.91,31.89A130.36,130.36,0,0,1,226.48,128,130.45,130.45,0,0,1,204.91,156.12ZM128,84a44,44,0,1,0,44,44A44.05,44.05,0,0,0,128,84Zm0,64a20,20,0,1,1,20-20A20,20,0,0,1,128,148Z"/></svg>
                <svg class="w-4 h-4 eye-closed hidden" aria-hidden="true" data-ph="eye-slash" viewBox="0 0 256 256" fill="currentColor"><path d="M56.88,31.93A12,12,0,1,0,39.12,48.07l16,17.65C20.67,88.66,5.72,121.58,5,123.13a12.08,12.08,0,0,0,0,9.75c.37.82,9.13,20.26,28.49,39.61C59.37,198.34,92,212,128,212a131.34,131.34,0,0,0,51-10l20.09,22.1a12,12,0,0,0,17.76-16.14ZM128,188c-29.59,0-55.47-10.73-76.91-31.88A130.69,130.69,0,0,1,29.52,128c5.27-9.31,18.79-29.9,42-44.29l90.09,99.11A109.33,109.33,0,0,1,128,188Zm123-55.12c-.36.81-9,20-28,39.16a12,12,0,1,1-17-16.9A130.48,130.48,0,0,0,226.48,128a130.36,130.36,0,0,0-21.57-28.12C183.46,78.73,157.59,68,128,68c-3.35,0-6.7.14-10,.42a12,12,0,1,1-2-23.91c3.93-.34,8-.51,12-.51,36,0,68.63,13.67,94.49,39.52,19.35,19.35,28.11,38.8,28.48,39.61A12.08,12.08,0,0,1,251,132.88Z"/></svg>
              </button>
            </div>
          </div>

          <div class="space-y-1.5">
            <label for="confirm-password" class="text-xs font-bold text-text-primary block">Xác Nhận Mật Khẩu Mới</label>
            <div class="relative">
              <input
                type="password"
                id="confirm-password"
                required
                minlength="8"
                placeholder="Nhập lại mật khẩu mới"
                class="w-full pl-4 pr-11 py-3 rounded-2xl bg-black/5 dark:bg-white/5 border border-glass-border text-sm text-text-primary placeholder:text-text-muted focus:outline-none focus:border-accent-primary transition-colors"
              />
              <button
                type="button"
                data-toggle-password="confirm-password"
                class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 rounded-xl text-text-muted hover:text-text-primary hover:bg-black/5 dark:hover:bg-white/5 transition-colors cursor-pointer"
                title="Hiện hoặc ẩn mật khẩu"
                aria-label="Hiện hoặc ẩn mật khẩu"
              >
                <svg class="w-4 h-4 eye-open" aria-hidden="true" data-ph="eye" viewBox="0 0 256 256" fill="currentColor"><path d="M251,123.13c-.37-.81-9.13-20.26-28.48-39.61C196.63,57.67,164,44,128,44S59.37,57.67,33.51,83.52C14.16,102.87,5.4,122.32,5,123.13a12.08,12.08,0,0,0,0,9.75c.37.82,9.13,20.26,28.49,39.61C59.37,198.34,92,212,128,212s68.63-13.66,94.48-39.51c19.36-19.35,28.12-38.79,28.49-39.61A12.08,12.08,0,0,0,251,123.13Zm-46.06,33C183.47,177.27,157.59,188,128,188s-55.47-10.73-76.91-31.88A130.36,130.36,0,0,1,29.52,128,130.45,130.45,0,0,1,51.09,99.89C72.54,78.73,98.41,68,128,68s55.46,10.73,76.91,31.89A130.36,130.36,0,0,1,226.48,128,130.45,130.45,0,0,1,204.91,156.12ZM128,84a44,44,0,1,0,44,44A44.05,44.05,0,0,0,128,84Zm0,64a20,20,0,1,1,20-20A20,20,0,0,1,128,148Z"/></svg>
                <svg class="w-4 h-4 eye-closed hidden" aria-hidden="true" data-ph="eye-slash" viewBox="0 0 256 256" fill="currentColor"><path d="M56.88,31.93A12,12,0,1,0,39.12,48.07l16,17.65C20.67,88.66,5.72,121.58,5,123.13a12.08,12.08,0,0,0,0,9.75c.37.82,9.13,20.26,28.49,39.61C59.37,198.34,92,212,128,212a131.34,131.34,0,0,0,51-10l20.09,22.1a12,12,0,0,0,17.76-16.14ZM128,188c-29.59,0-55.47-10.73-76.91-31.88A130.69,130.69,0,0,1,29.52,128c5.27-9.31,18.79-29.9,42-44.29l90.09,99.11A109.33,109.33,0,0,1,128,188Zm123-55.12c-.36.81-9,20-28,39.16a12,12,0,1,1-17-16.9A130.48,130.48,0,0,0,226.48,128a130.36,130.36,0,0,0-21.57-28.12C183.46,78.73,157.59,68,128,68c-3.35,0-6.7.14-10,.42a12,12,0,1,1-2-23.91c3.93-.34,8-.51,12-.51,36,0,68.63,13.67,94.49,39.52,19.35,19.35,28.11,38.8,28.48,39.61A12.08,12.08,0,0,1,251,132.88Z"/></svg>
              </button>
            </div>
            <span id="password-match-hint" class="text-xs font-semibold block"></span>
          </div>

          <button
            type="submit"
            id="reset-submit-btn"
            class="w-full py-3.5 rounded-full bg-warm-gradient hover:brightness-105 text-white font-bold text-sm transition-all shadow-glow active:scale-[0.98] flex items-center justify-center gap-2 cursor-pointer mt-2"
          >
            <span id="btn-text">Lưu Mật Khẩu Quản Trị</span>
            <div id="btn-spinner" class="hidden w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></div>
          </button>
        </form>

        <div class="text-center pt-2">
          <a href="/admin-login.html" class="text-xs text-text-muted hover:text-accent-primary font-semibold transition-colors">
            ← Quay lại trang Đăng nhập Quản trị
          </a>
        </div>

      </div>
    </main>

    <!-- Footer -->
    <footer class="py-5 text-center text-xs text-text-muted border-t border-glass-border">
      © 2026 Guitar By Quang • Khu vực quản trị nội bộ
    </footer>

    <!-- Global Toast Container -->
    <div id="toast-notification" class="fixed top-6 right-6 z-[9999] opacity-0 pointer-events-none transition-all duration-300 transform translate-x-12">
      <div class="bg-glass-bg backdrop-blur-xl border border-glass-border rounded-2xl shadow-xl px-5 py-4 max-w-sm flex items-center gap-3">
        <div id="toast-icon" class="flex-shrink-0 text-xl"></div>
        <p id="toast-message" class="text-text-primary font-medium text-sm leading-snug"></p>
      </div>
    </div>

    <!-- Common utilities -->
    <script type="module" src="/src/common.js"></script>
    <script type="module" src="/src/admin-reset-password.js"></script>
  </body>
</html>
